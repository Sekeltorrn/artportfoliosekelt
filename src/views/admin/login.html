<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Portal Login | Art Studio</title>

  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global & Admin Stylesheets -->
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/admin-theme.css">
</head>
<body class="admin-body">
  <main class="auth-page" id="auth-main">
    <div class="auth-card" id="admin-login-card">
      
      <!-- Brand & Header -->
      <div class="auth-header">
        <div class="auth-logo-badge" aria-hidden="true">
          <!-- Palette / Studio Vector Icon -->
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
          </svg>
        </div>
        <h1 class="auth-title">Artist Studio Portal</h1>
        <p class="auth-subtitle">Authenticate to access commissions and portfolio settings</p>
      </div>

      <!-- Error Message Banner Container -->
      <div id="auth-error-message" class="auth-alert error hidden" role="alert" aria-live="polite">
        <svg class="auth-alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <span id="auth-error-text">Invalid credentials. Please try again.</span>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="admin-login-form" novalidate>
        
        <!-- Username or Email Field -->
        <div class="form-group">
          <label class="form-label" for="login-username">Username or Email</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </span>
            <input 
              type="text" 
              id="login-username" 
              name="username" 
              class="form-input" 
              placeholder="admin@studio.art" 
              required 
              autocomplete="username" 
              autofocus
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
            >
          </div>
        </div>

        <!-- Form Utilities -->
        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox" id="remember-session" name="remember">
            <span>Remember session</span>
          </label>
        </div>

        <!-- Submit Button with Loading Spinner State -->
        <button type="submit" id="login-submit-btn" class="btn-submit">
          <span class="spinner hidden" id="login-spinner" aria-hidden="true"></span>
          <span id="login-btn-text">Sign In to Dashboard</span>
        </button>

      </form>

      <!-- Return to Public Portfolio -->
      <footer class="auth-footer">
        <a href="/" class="auth-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Return to Public Portfolio
        </a>
      </footer>

    </div>
  </main>

  <!-- Client-side Auth Script -->
  <script type="module" src="/src/js/admin/auth-client.js"></script>
</body>
</html>
